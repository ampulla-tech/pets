# The backup harness's stack (backup/test.sh): Postgres with the API's schema,
# a MinIO standing in for R2 (the media bucket and the restic bucket), the API
# image to migrate and fill the database, and the backup image. Nothing here
# is production configuration and every credential is a throwaway.

name: pets-backup-test

x-db: &db
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: pets
  PGDATABASE: pets
  PGPASSWORD: pets

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pets
      POSTGRES_USER: pets
      POSTGRES_PASSWORD: pets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pets -d pets"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: harness
      MINIO_ROOT_PASSWORD: harness-secret

  pets:
    image: ${TEST_PETS_IMAGE:?}
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: backup-harness-only
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pets
      POSTGRES_USER: pets
      POSTGRES_PASSWORD: pets
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: ${TEST_BACKUP_IMAGE:?}
    environment:
      <<: *db
      DUMP_RESTIC_HOST: pets-harness
      RESTIC_REPOSITORY: s3:http://minio:9000/restic
      RESTIC_PASSWORD: harness-restic
      RESTIC_AWS_ACCESS_KEY_ID: harness
      RESTIC_AWS_SECRET_ACCESS_KEY: harness-secret
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_PROVIDER: Minio
      MEDIA_S3_BUCKET: media
      MEDIA_S3_ACCESS_KEY_ID: harness
      MEDIA_S3_SECRET_ACCESS_KEY: harness-secret
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
