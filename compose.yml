# The local stack: `docker compose up` runs Postgres, the API on :8300, the
# worker that reads card photos and Mailpit, which catches every e-mail the API
# sends (sign-up and reset codes, reminders) and shows it on :8325. The web app runs beside it with `pnpm dev`
# (http://localhost:5180); the native app with `pnpm --filter pets-mobile start`.
#
# From a phone on the same Wi-Fi: `HOST_IP=<your-lan-ip> docker compose up`
# allowlists that address on the API.
name: pets

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: dev
  env_file:
    - path: ./backend/.env
      required: false
  environment: &backend-env
    DJANGO_DEBUG: "True"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,pets${HOST_IP:+,${HOST_IP}}
    CORS_ALLOWED_ORIGINS: http://localhost:5180,http://127.0.0.1:5180${HOST_IP:+,http://${HOST_IP}:5180}
    WEB_APP_URL: http://localhost:5180
    # Mail goes to Mailpit, never out (production sends through Resend).
    EMAIL_HOST: pets-mail
    EMAIL_PORT: "1025"
    POSTGRES_HOST: pets-db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: pets
    POSTGRES_USER: pets
    POSTGRES_PASSWORD: pets
    # No AWS_STORAGE_BUCKET_NAME: media stays on disk, in the volume below.
  volumes:
    - ./backend:/app
    - /app/.venv
    - pets_media:/app/uploads
  depends_on:
    pets-db:
      condition: service_healthy
    pets-mail:
      condition: service_started

services:
  pets-db:
    image: postgres:17
    environment:
      POSTGRES_DB: pets
      POSTGRES_USER: pets
      POSTGRES_PASSWORD: pets
    ports:
      - "5435:5432"
    volumes:
      - pets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pets"]
      interval: 5s
      timeout: 5s
      retries: 5

  pets-mail:
    image: axllent/mailpit:v1.27
    ports:
      - "8325:8025" # the web UI: http://localhost:8325
      - "1325:1025" # SMTP, for an API run outside compose
    environment:
      MP_MAX_MESSAGES: "500"

  pets:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8300:8000"

  pets-worker:
    <<: *backend
    command: python manage.py run_intake_worker
    # It starts with the API, which migrates first: until the tables exist the
    # worker exits and is started again.
    restart: on-failure
    depends_on:
      pets:
        condition: service_started

volumes:
  pets_pgdata:
  pets_media:
