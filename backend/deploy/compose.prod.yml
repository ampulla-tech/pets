# Pets in production on a VPS shared with other apps: the API, the
# photo-reading worker, the scheduled commands, Postgres 17, and the nightly
# backup of the database and the media bucket to restic. RUNBOOK.md has the
# procedures.
#
# Nothing here publishes a port. The host's edge proxy (Caddy with
# caddy-docker-proxy, owned by the infra repository) reads the `caddy` labels
# of the `pets` service on the external `edge` network, holds the certificate
# and forwards api.pets.ampulla.tech to it. Only `pets` joins `edge`; the
# worker, cron, Postgres and the backup stay on this project's own network.
# The web app is not served from here: it is on Cloudflare Pages.
#
# Files beside this one on the host, mode 0600, written by deploy.sh from the
# deploy job's secrets, never committed:
# - `.env`: read by Compose for the ${...} below (image owner and tag, the
#   database password, the R2 account).
# - `.env.pets`: the API's secrets (Django key, the media bucket's read-write
#   keys, Resend, OpenRouter, VAPID), handed to the API, the worker and cron.
# - `.env.backup`: the restic password and the repository's keys, the media
#   bucket's read-only keys and the heartbeat URL, handed to the backup only.

name: pets

x-pets: &pets
  image: ghcr.io/${GHCR_OWNER:?}/pets:${IMAGE_TAG:?}
  restart: unless-stopped
  env_file:
    - path: .env.pets
  environment:
    DJANGO_DEBUG: "False"
    DJANGO_ALLOWED_HOSTS: api.pets.ampulla.tech
    # The web app on pets.ampulla.tech calls the API on api.pets.ampulla.tech
    # with its session cookie. The cookies are set for pets.ampulla.tech, a
    # parent of the API's host, so the web reads the CSRF one and both travel
    # to the API (ADR-0002).
    CORS_ALLOWED_ORIGINS: https://pets.ampulla.tech
    CSRF_TRUSTED_ORIGINS: https://pets.ampulla.tech
    SESSION_COOKIE_DOMAIN: pets.ampulla.tech
    CSRF_COOKIE_DOMAIN: pets.ampulla.tech
    WEB_APP_URL: https://pets.ampulla.tech
    DEFAULT_FROM_EMAIL: pets@ampulla.tech
    # ADR-0007.
    INTAKE_MODEL: openai/gpt-6.1-terra
    # Media in a private R2 bucket; its read-write keys are in .env.pets.
    AWS_STORAGE_BUCKET_NAME: ampulla-pets-media
    AWS_S3_ENDPOINT_URL: https://${R2_ACCOUNT_ID:?}.r2.cloudflarestorage.com
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: pets
    POSTGRES_USER: pets
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    TZ: America/Sao_Paulo
  depends_on:
    postgres:
      condition: service_healthy

services:
  pets:
    <<: *pets
    networks:
      - default
      - edge
    labels:
      caddy: api.pets.ampulla.tech
      caddy.encode: zstd gzip
      # Above the API's own limit (MAX_UPLOAD_BYTES, 25 MB), so an oversized
      # upload gets the API's answer and not the proxy's.
      caddy.request_body.max_size: 30MB
      caddy.reverse_proxy: "{{upstreams 8000}}"

  worker:
    <<: *pets
    command: ["python", "manage.py", "run_intake_worker"]

  cron:
    <<: *pets
    command: ["supercronic", "/app/crontab"]

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pets
      POSTGRES_USER: pets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pets -d pets"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: ghcr.io/${GHCR_OWNER:?}/pets-backup:${IMAGE_TAG:?}
    restart: unless-stopped
    command: ["supercronic", "/opt/backup/crontab"]
    env_file:
      - path: .env.backup
    environment:
      TZ: America/Sao_Paulo
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: pets
      PGDATABASE: pets
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      DUMP_RESTIC_HOST: pets-vps
      RESTIC_REPOSITORY: s3:https://${R2_ACCOUNT_ID:?}.r2.cloudflarestorage.com/ampulla-backup-pets
      MEDIA_S3_ENDPOINT: https://${R2_ACCOUNT_ID:?}.r2.cloudflarestorage.com
      MEDIA_S3_PROVIDER: Cloudflare
      MEDIA_S3_BUCKET: ampulla-pets-media
    volumes:
      - restic-cache:/root/.cache/restic
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
    external: true
    name: edge

volumes:
  postgres-data:
  restic-cache:
