# Pets in production on a VPS: Caddy in front, the API, the photo-reading
# worker, the scheduled commands, Postgres 17, and the nightly backup of the
# database and the media bucket to restic. RUNBOOK.md has the procedures.
#
# Files beside this one on the host, mode 0600, never committed:
# - `.env`: read by Compose for the ${...} below (image owner and tag, the
#   database password).
# - `.env.pets`: the API's secrets (Django key, bucket keys, Resend, OpenRouter,
#   VAPID), handed to the API, the worker and cron only.
# - `.env.backup`: the restic repository, its password, the bucket's read keys
#   and the heartbeat URL, handed to the backup only.
#
# Only Caddy publishes ports.

name: pets

x-pets: &pets
  image: ghcr.io/${GHCR_OWNER:?}/pets:${IMAGE_TAG:?}
  restart: unless-stopped
  env_file:
    - path: .env.pets
  environment: &pets-environment
    DJANGO_DEBUG: "False"
    DJANGO_ALLOWED_HOSTS: api.pets.ampulla.tech
    CORS_ALLOWED_ORIGINS: https://pets.ampulla.tech
    WEB_APP_URL: https://pets.ampulla.tech
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: pets
    POSTGRES_USER: pets
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    TZ: America/Sao_Paulo
  depends_on:
    postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pets

  pets:
    <<: *pets

  worker:
    <<: *pets
    command: ["python", "manage.py", "run_intake_worker"]

  cron:
    <<: *pets
    command: ["supercronic", "/app/crontab"]

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pets
      POSTGRES_USER: pets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pets -d pets"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: ghcr.io/${GHCR_OWNER:?}/pets-backup:${IMAGE_TAG:?}
    restart: unless-stopped
    command: ["supercronic", "/opt/backup/crontab"]
    env_file:
      - path: .env.backup
    environment:
      TZ: America/Sao_Paulo
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: pets
      PGDATABASE: pets
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      DUMP_RESTIC_HOST: pets-vps
    volumes:
      - restic-cache:/root/.cache/restic
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  restic-cache:
