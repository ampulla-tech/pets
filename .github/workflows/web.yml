name: Web CI

on:
  push:
    branches: [main]
    paths: ["web/**", "packages/core/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]
  pull_request:
    branches: [main]
    paths: ["web/**", "packages/core/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type-check · Test · Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@pets/web..." --filter pets
      - run: pnpm --filter @pets/web typecheck
      - run: pnpm --filter @pets/web test
      - run: pnpm --filter @pets/web build
